# cargo-audit configuration
# See https://github.com/rustsec/rustsec/tree/main/cargo-audit#configuration
#
# An advisory may be ignored only while its crate is in Cargo.lock, with a comment line
#   # <ID> (crate <name>): <why it does not apply>
# directly above the list. `deployment_tests::an_advisory_is_ignored_only_while_its_crate_is_locked`
# enforces this. Mirror every entry in /backend/osv-scanner.toml.

[advisories]
ignore = []
