# @spec DEPLOY-CI-009
# osv-scanner configuration
# Per https://google.github.io/osv-scanner/configuration/, this file applies
# only to lockfiles in the same directory (backend/Cargo.lock), which is
# exactly the scope we want.
#
# An advisory may be ignored only while its crate is in Cargo.lock, with a comment line
#   # <ID> (crate <name>): <why it does not apply>
# directly above its entry. `deployment_tests::an_advisory_is_ignored_only_while_its_crate_is_locked`
# enforces this. Mirror every entry in /backend/.cargo/audit.toml.

# GHSA-qwgh-2vcv-g2f7 (crate block-buffer): a caught panic inside a hash update can leave
# block-buffer 0.10's cursor out of bounds. It reaches us only through sqlx 0.9 -> sha2 0.10,
# where sha2 hashes PostgreSQL SCRAM credentials and migration checksums and nothing catches
# a panic mid-hash; the app has no such catch either. The fix is block-buffer 0.12.1 on the
# sha2 0.11 line, which no sqlx release uses yet. Drop this once sqlx moves to sha2 0.11.
[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
reason = "Only reachable by catching a panic mid-hash, which neither sqlx nor the app does; waiting on sqlx to adopt sha2 0.11"

# RUSTSEC-2026-0459 (crate libsqlite3-sys): the bundled SQLite before 3.54.0 can return
# uninitialized page-cache memory when a database file is opened together with a crafted
# sibling `-wal` file. The crate reaches Cargo.lock only through sqlx 0.9's optional
# `sqlx-sqlite` driver, which this build never enables: `cargo tree -e all -i libsqlite3-sys`
# prints nothing, so no SQLite is compiled into the binary and the app opens no SQLite files
# (PostgreSQL only). sqlx-sqlite 0.9.0 pins libsqlite3-sys < 0.38 and no later sqlx release
# exists, so the lockfile cannot carry the fixed 0.39. Drop this once sqlx accepts 0.39+.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
reason = "libsqlite3-sys is an optional sqlx-sqlite dependency this build never compiles (PostgreSQL only); sqlx 0.9.0 pins it below the fixed 0.39"
