[package]
name = "turfops-backend"
version = "0.1.0"
edition = "2021"
description = "TurfOps lawn care management web application"
authors = ["tgrecojr"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["cors", "fs", "limit"] }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "io-util",
    "signal",
] }

# Database
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "migrate",
    "macros",
] }

# HTTP client (for external datasources)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Embedded analytics engine for reading the weather data lake (parquet on mounted FS).
# `bundled` statically compiles libduckdb into the binary (no runtime lib needed);
# `parquet` links DuckDB's parquet extension in too, so a lake read never installs or
# downloads an extension (the distroless runtime has no home directory or egress for
# that); `chrono` enables TIMESTAMP/DATE <-> chrono mapping.
# Floor 1.20000.1 (DuckDB 2.0.0): 1.20000.0's bundled build cannot link the static
# extension on Linux/GNU ld (duckdb-rs issue 920, fixed in 1.20000.1).
# @spec DEPLOY-IMAGE-011
duckdb = { version = "1.20000.1", features = ["bundled", "chrono", "parquet"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }
# IANA zones: resolves `TZ` into the app clock (and lets tests use a real zone).
chrono-tz = "0.10.4"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Optional: only used by `cargo run --features dev-env` for loading .env locally.
# Production containers receive env vars from the orchestrator and do not need this.
dotenvy = { version = "0.15", optional = true }
rmcp = { version = "3.4", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
subtle = "2"

[features]
default = []
dev-env = ["dep:dotenvy"]
# Tests that need PostgreSQL: `DATABASE_URL=postgres://… cargo test --features db-tests`.
# Each `#[sqlx::test]` gets a fresh database with every migration applied.
db-tests = []

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
