name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the `db-tests` suite; trust auth, reachable only from this job.
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        working-directory: backend
        run: cargo fmt --check

      - name: Lint with Clippy
        working-directory: backend
        run: cargo clippy -- -D warnings

      - name: Run tests (including PostgreSQL-backed tests)
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: cargo test --features db-tests

  frontend:
    name: Frontend (React/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # @spec UI-BUILD-007
      - name: Type check
        run: npx tsc -b

      # @spec UI-BUILD-006
      - name: Lint
        run: npm run lint

      # @spec UI-BUILD-009
      - name: Test
        run: npm test

  supply-chain:
    name: Supply chain
    uses: ./.github/workflows/supply-chain.yml
    secrets: inherit
