# @spec DEPLOY-CI-004, DEPLOY-CI-005
name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  supply-chain:
    name: Supply chain
    permissions:
      contents: read
    uses: chainringlabs/ci/.github/workflows/supply-chain.yml@f8888baa2af7a041fe6a5a11f8fe0be182357cc3 # v1.2.1
    with:
      npm-dir: frontend
      cargo-dir: backend
      socket-dir: frontend
      node-version: "26"
    secrets: inherit

  # The organization's shared publish workflow: builds on pull requests
  # without pushing; otherwise pushes to GHCR (latest, semver, sha), signs
  # with cosign and attaches an SPDX SBOM and build provenance.
  image:
    needs: supply-chain
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: chainringlabs/ci/.github/workflows/docker-publish.yml@05de2072e684885be22a0185e3d712d8082a15eb # v1.1.0
